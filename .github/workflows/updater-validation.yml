name: Validate portable updater
on:
  push:
    paths:
      - app/updater.ts
      - scripts/test-portable-update.mjs
      - .github/workflows/updater-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-update:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-portable-update.mjs
